# Based on https://github.com/actions-rs/meta/blob/master/recipes/quickstart.md

# Pull requests get coverage from the pull_request event; pushes are only
# covered on main (codecov's base for PR comparisons). Running on every push
# as well doubled the job on every PR commit.
on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

name: Generate Coverage report

jobs:
  coverage:
    runs-on: ubuntu-latest
    container: mwatelescope/marlu:latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate test lcov coverage into coverage/ dir
        run: |
          mkdir -p coverage
          /opt/cargo/bin/cargo llvm-cov --lib --lcov --output-path coverage/coverage.lcov
          # this uses the result of the previous run to generate a text summary
          /opt/cargo/bin/cargo llvm-cov --no-run

      - name: Install codecov dependencies
        run: apt-get update && apt-get install -y bash curl gpg git

      - name: Upload reports to codecov.io
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
